# Pull requests build and validate the compatibility image.
# After the release PR merges, manually dispatch from main to publish and deploy.
name: Open-System release

on:
  pull_request:
    branches: [main]
    paths:
      - 'deploy/**'
      - '.github/workflows/open-system-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-system-release-${{ github.event_name == 'workflow_dispatch' && 'production' || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  DOCKERFILE: deploy/open-system-compat.Dockerfile
  RELEASE_FILE: deploy/open-system.release
  IMAGE_REPO: hillstreet/open-system

jobs:
  plan:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Read the pinned Hermes version
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/^# hermes-version:/ { print $3 }' "$DOCKERFILE")"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=${version}-compat-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: deploy
      - name: Build compatibility image
        run: docker build -f "$DOCKERFILE" -t open-system-compat:test .
      - name: Verify release, tunnel and plugins
        shell: bash
        env:
          HERMES_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          docker run --rm -e HERMES_VERSION --entrypoint /bin/sh open-system-compat:test -c '
            set -eu
            test -x /usr/local/bin/tunnel-client
            test -f /etc/s6-overlay/s6-rc.d/user/contents.d/hermes-mcp-tunnel
            grep -q "hermes mcp-serve" /etc/s6-overlay/s6-rc.d/hermes-mcp-tunnel/run
            test -f /opt/hermes/plugins/mcp-serve/plugin.yaml
            test -f /opt/hermes/plugins/spotify/plugin.yaml
            test -f /opt/hermes/plugins/langfuse/plugin.yaml
            test -f /opt/hermes/plugins/memory-wiki/plugin.yaml
            test -f /opt/hermes/plugins/hermes-security/plugin.yaml
            /opt/hermes/.venv/bin/hermes --version > /tmp/version.txt
            grep -q "$HERMES_VERSION" /tmp/version.txt
            mkdir -p /tmp/hermes-test
            printf "plugins:\\n  enabled:\\n    - mcp-serve\\n    - spotify\\n    - langfuse\\n" > /tmp/hermes-test/config.yaml
            export HOME=/tmp/hermes-test HERMES_HOME=/tmp/hermes-test
            /opt/hermes/.venv/bin/hermes pm install venv
            # Only the venv is installed here; other pm packages (node, browsers, ...) install on the host at
            # first start. Since v0.23 pm.drift() also lists those, so assert on what this step installed.
            /opt/hermes/.venv/bin/python -c "import pm; d = pm.drift(); print(\"pm drift:\", sorted(d.items())); assert \"venv\" not in d"
            /opt/hermes/.venv/bin/python -c "from pathlib import Path; from pm.environments import activate_dependencies; activate_dependencies(Path(\"/opt/hermes\")); import mcp.server, langfuse, httpx, cryptography"
            /opt/hermes/.venv/bin/hermes mcp-serve --help > /tmp/mcp-help.txt
            grep -q "stdio MCP server" /tmp/mcp-help.txt
            test -f /etc/s6-overlay/s6-rc.d/user/contents.d/hermes-mcp-http
            test -x /etc/s6-overlay/s6-rc.d/hermes-mcp-http/run
            test -f /etc/s6-overlay/s6-rc.d/user/contents.d/hermes-offsite-backup
            test -x /etc/s6-overlay/s6-rc.d/hermes-offsite-backup/run
            if HERMES_BACKUP_TRANSFER_TOKEN= HERMES_BACKUP_ENCRYPTION_KEY= HERMES_HOME=/tmp/hermes-test /opt/hermes/.venv/bin/python -I /opt/offsite-backup/offsite_backup.py --once; then echo "offsite backup ran without secrets" >&2; exit 1; fi
            test -x /etc/cont-init.d/016-config-repair
            test -x /etc/cont-init.d/017-sandbox-ssh
            test -x /etc/cont-init.d/018-gadget-port
            test -f /opt/gadget-port/gadget_port.py
            mkdir -p /tmp/gp/profiles/p1
            printf "platforms:\\n  gadget:\\n    enabled: true\\n    extra:\\n      port: 8765  # ws\\n  api_server:\\n    port: 8642\\n" > /tmp/gp/config.yaml
            printf "gadget:\\n  enabled: true\\n  port: 8765\\n" > /tmp/gp/profiles/p1/config.yaml
            HERMES_HOME=/tmp/gp /opt/config-repair/venv/bin/python -I /opt/gadget-port/gadget_port.py
            /opt/config-repair/venv/bin/python -I -c "import yaml; d = yaml.safe_load(open(\"/tmp/gp/config.yaml\")); assert d[\"platforms\"][\"gadget\"][\"extra\"][\"port\"] == 8766, d; assert d[\"platforms\"][\"api_server\"][\"port\"] == 8642, d"
            /opt/config-repair/venv/bin/python -I -c "import yaml; d = yaml.safe_load(open(\"/tmp/gp/profiles/p1/config.yaml\")); assert d[\"gadget\"][\"port\"] == 8766, d"
            grep -q "# ws" /tmp/gp/config.yaml
            HERMES_HOME=/tmp/gp /opt/config-repair/venv/bin/python -I /opt/gadget-port/gadget_port.py
            ls /tmp/gp/backups/config/config.yaml.gadget-port-*
            mkdir -p /tmp/cr && printf "model:\\n  default: open-connect/auto\\n  rotation_strategy: x\\n continuous_rotation: true\\n" > /tmp/cr/config.yaml
            HERMES_HOME=/tmp/cr /opt/config-repair/venv/bin/python -I /opt/config-repair/config_repair.py
            /opt/config-repair/venv/bin/python -I -c "import yaml; d = yaml.safe_load(open(\"/tmp/cr/config.yaml\")); assert d[\"model\"][\"default\"] == \"open-connect/auto\", d"
            ls /tmp/cr/backups/config/config.yaml.unparseable-*
            /opt/mcp-http/bin/python -I -c "import mcp_proxy.mcp_server, mcp_proxy.proxy_server"
            if MCP_HTTP_TOKEN=short /opt/mcp-http/bin/python -I /opt/mcp-http/server.py; then echo "mcp-http started without a valid token" >&2; exit 1; fi
          '
      - name: Publish tested image under an immutable tag
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        id: publish
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_USERNAME" && test -n "$DOCKERHUB_TOKEN"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          image="${IMAGE_REPO}:${TAG}"
          docker tag open-system-compat:test "$image"
          docker push "$image"
          docker logout
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "- published \`$image\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [plan, build]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_VOLUME_INSTANCE_ID: ${{ vars.RAILWAY_VOLUME_INSTANCE_ID }}
      STATUS_URL: ${{ vars.OPEN_SYSTEM_STATUS_URL || 'https://open-system.space/api/status' }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - name: Check deploy configuration
        id: cfg
        shell: bash
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_SERVICE_ID" ] || [ -z "$RAILWAY_ENVIRONMENT_ID" ]; then
            echo "::warning::RAILWAY_TOKEN / RAILWAY_SERVICE_ID / RAILWAY_ENVIRONMENT_ID not configured; deploy skipped. Image ${TAG} is published and can be deployed manually."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Record rollback point
        if: steps.cfg.outputs.ready == 'true'
        id: prev
        shell: bash
        run: |
          set -euo pipefail
          # Railway is the source of truth for what is running; the release file is the fallback.
          cur="$(bash deploy/railway.sh current-image 2>/dev/null || true)"
          case "$cur" in *"${IMAGE_REPO}:"*) prev="${cur##*:}" ;; *) prev="$(sed -n 's/^tag=//p' "$RELEASE_FILE" 2>/dev/null || true)" ;; esac
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          echo "- rollback point: \`${IMAGE_REPO}:${prev:-<none recorded>}\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Pre-deploy volume snapshot (Railway native backup)
        if: steps.cfg.outputs.ready == 'true' && env.RAILWAY_VOLUME_INSTANCE_ID != ''
        # Railway's scheduled backups and the continuous off-site backups also cover a rollback; a full
        # snapshot quota (it blocked the 2026-11-09 upgrade) must not stop releases. The health gate and
        # automatic rollback to the previous image still apply.
        continue-on-error: true
        shell: bash
        run: bash deploy/railway.sh backup "pre-deploy-${TAG}"
      - name: Ensure MCP bridge token (mcp.open-system.space)
        if: steps.cfg.outputs.ready == 'true'
        shell: bash
        run: bash deploy/railway.sh ensure-secret MCP_HTTP_TOKEN
      - name: Deploy image to Railway
        if: steps.cfg.outputs.ready == 'true'
        id: rollout
        shell: bash
        run: bash deploy/railway.sh image "docker.io/${IMAGE_REPO}:${TAG}"
      - name: Health gate
        if: steps.cfg.outputs.ready == 'true'
        id: gate
        shell: bash
        run: |
          set -uo pipefail
          want="${VERSION#v}"
          for i in $(seq 1 40); do
            sleep 15
            body="$(curl -fsS --max-time 15 "$STATUS_URL" 2>/dev/null)" || { echo "try $i: unreachable"; continue; }
            if printf '%s' "$body" | WANT="$want" python3 -c '
          import json, os, sys
          s = json.load(sys.stdin)
          tg = (s.get("gateway_platforms") or {}).get("telegram", {}).get("state")
          # gateway_state "startup_failed" with gateway_running true = config.yaml did not load (2026-11-12)
          ok = (s.get("auth_required") is True and bool(s.get("auth_providers"))
                and s.get("version") == os.environ["WANT"] and s.get("gateway_running") is True
                and s.get("gateway_state") != "startup_failed" and tg in (None, "connected"))
          print("version=%s gateway=%s telegram=%s" % (s.get("version"), s.get("gateway_state"), tg))
          sys.exit(0 if ok else 1)'; then
              echo "healthy=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "healthy=false" >> "$GITHUB_OUTPUT"
          exit 1
      - name: MCP bridge check (warning only)
        if: steps.cfg.outputs.ready == 'true' && steps.gate.outputs.healthy == 'true'
        shell: bash
        run: |
          for _ in 1 2 3 4 5 6; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://mcp.open-system.space/healthz)"
            [ "$code" = 204 ] && { echo "- MCP bridge healthy (mcp.open-system.space)" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
            sleep 10
          done
          echo "::warning::mcp.open-system.space/healthz returned $code"
      - name: Roll back to the previous release
        if: failure() && steps.prev.outputs.prev != '' && (steps.rollout.outcome == 'failure' || steps.gate.outcome == 'failure')
        shell: bash
        env:
          PREV: ${{ steps.prev.outputs.prev }}
        run: |
          set -euo pipefail
          bash deploy/railway.sh image "docker.io/${IMAGE_REPO}:${PREV}"
          for _ in $(seq 1 40); do
            sleep 15
            if curl -fsS --max-time 15 "$STATUS_URL" | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("gateway_running") else 1)'; then
              echo "- rolled back to \`${IMAGE_REPO}:${PREV}\` and gateway is running" >> "$GITHUB_STEP_SUMMARY"; exit 0
            fi
          done
          echo "::error::Rollback to ${PREV} did not become healthy"; exit 1
      - name: Open incident issue
        if: failure()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Production deploy of ${process.env.TAG} failed`,
              body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nTarget: ${process.env.TAG}\nThe pipeline attempted an automatic rollback; see the run summary.`,
              labels: ['incident'],
            });
      - name: Record the deployed image in a pull request
        # main is protected (PR + required "ci" check), so the record lands through an auto-merging PR.
        # A PAT (UPSTREAM_SYNC_TOKEN) is preferred: PRs opened with GITHUB_TOKEN do not trigger the
        # required check. Production is already healthy here, so a failure to record only warns.
        if: success() && steps.cfg.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
        run: |
          set -uo pipefail
          printf 'tag=%s\nversion=%s\ndeployed_at=%s\nrun=%s\n' "$TAG" "$VERSION" "$(date -u +%FT%TZ)" "$GITHUB_RUN_ID" > "$RELEASE_FILE"
          git config user.name "open-system-release[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RELEASE_FILE"
          git diff --cached --quiet && exit 0
          branch="chore/release-${TAG}"
          git checkout -b "$branch"
          git commit -s -m "release(open-system): ${VERSION} deployed as ${TAG}"
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git push -u origin "$branch" \
             && url="$(gh pr create --base main --head "$branch" --title "release(open-system): ${VERSION} deployed as ${TAG}" \
                  --body "Automated release record from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Production already runs this image (health gate passed).")" \
             && gh pr merge "$url" --squash --auto --delete-branch; then
            echo "- release record PR (auto-merge): $url" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Could not open/auto-merge the release-record PR; production runs ${TAG}. Merge ${branch} manually."
            echo "- release record NOT merged; branch \`${branch}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
