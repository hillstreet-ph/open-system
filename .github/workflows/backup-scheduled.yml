name: Scheduled backup (Open-System)

# Runs a real encrypted database backup on schedule or explicit dispatch.
# Volume backup still requires host/Zeabur access because GitHub Actions cannot
# reach the mounted /opt/data volume without operator-provided SSH access.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      run_db_backup:
        description: "Attempt encrypted Supabase pg_dump"
        type: boolean
        default: false
      record_sync_event:
        description: "POST sync event to Supabase REST if service role configured"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  backup-checklist:
    if: github.repository == 'hillstreet-ph/open-system'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Emit operator checklist
        run: |
          {
            echo "### Open-System automated backup"
            echo "- Volume state: run \`scripts/backup/backup-state.sh\` on host/Zeabur with HERMES_HOME=/opt/data"
            echo "- Verify: \`scripts/backup/verify-backup.sh\`"
            echo "- Database: scheduled encrypted \`pg_dump\` job below"
            echo "- Offsite: set BACKUP_S3_URI + AWS credentials"
            echo "- Encryption: BACKUP_ENCRYPT_KEY is mandatory in GitHub Actions"
          } >> "$GITHUB_STEP_SUMMARY"

  supabase-sync-event:
    if: github.repository == 'hillstreet-ph/open-system' && (github.event_name == 'schedule' || inputs.record_sync_event == true)
    runs-on: ubuntu-latest
    steps:
      - name: Record sync event (optional)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "Supabase secrets not configured; skipping REST sync event."
            exit 0
          fi
          BODY=$(python3 -c 'import json,os,time; print(json.dumps({
            "source":"github",
            "event_type":"scheduled_backup_tick",
            "payload":{"repo":os.environ.get("GITHUB_REPOSITORY"),"sha":os.environ.get("GITHUB_SHA"),"at":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime())}
          }))')
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST \
            "${SUPABASE_URL%/}/rest/v1/open_system_sync_events" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "$BODY" || true)
          echo "HTTP $code"
          if [ "$code" != "201" ] && [ "$code" != "200" ]; then
            echo "Note: table may not exist yet — apply supabase/migrations first."
            cat /tmp/out.json || true
            exit 0
          fi

  database-backup:
    if: github.repository == 'hillstreet-ph/open-system' && (github.event_name == 'schedule' || inputs.run_db_backup == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pg_dump
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Dump encrypted database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_ENCRYPT_KEY: ${{ secrets.BACKUP_ENCRYPT_KEY }}
          BACKUP_S3_URI: ${{ secrets.BACKUP_S3_URI }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          OPEN_SYSTEM_GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL secret missing; cannot dump."
            exit 1
          fi
          if [ -z "${BACKUP_ENCRYPT_KEY:-}" ]; then
            echo "BACKUP_ENCRYPT_KEY secret missing; refusing to create a GitHub artifact containing a plaintext database dump."
            exit 1
          fi
          ./scripts/supabase/backup-database.sh
          backup_dir=$(find /tmp/open-system-backups -mindepth 1 -maxdepth 1 -type d -name 'db-*' | sort | tail -1)
          ./scripts/backup/verify-backup.sh "$backup_dir"
      - name: Upload encrypted artifact (short retention)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: /tmp/open-system-backups/
          if-no-files-found: error
          retention-days: 7
