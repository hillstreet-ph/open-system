name: GitHub → Supabase deployment sync

# A successful Docker release proves only that an image was published.
# Automatic runs record non-production artifact metadata. Staging and
# production deployment records require separate verified promotion evidence
# and the existing human approval gate.
on:
  workflow_run:
    workflows: ["Open-System Docker Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  record:
    if: github.repository == 'hillstreet-ph/open-system' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download immutable artifact metadata
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: open-system-image-metadata
          path: /tmp/open-system-image-metadata
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Resolve immutable artifact identity
        id: artifact
        env:
          METADATA_FILE: /tmp/open-system-image-metadata/metadata.json
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [ ! -s "$METADATA_FILE" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Immutable artifact metadata is unavailable; Supabase record skipped."
            exit 0
          fi
          git_sha=$(jq -er '.git_sha' "$METADATA_FILE")
          image_ref=$(jq -er '.image_ref' "$METADATA_FILE")
          image_digest=$(jq -er '.image_digest' "$METADATA_FILE")
          if [ "$git_sha" != "$SOURCE_SHA" ]; then
            echo "::error::Artifact metadata SHA does not match the completed Docker workflow."
            exit 1
          fi
          if [[ ! "$image_ref" =~ :sha-${git_sha:0:7}$ ]]; then
            echo "::error::Artifact metadata image tag does not match the source SHA."
            exit 1
          fi
          if [[ ! "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Artifact metadata does not contain a valid immutable digest."
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "git_sha=$git_sha" >> "$GITHUB_OUTPUT"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"

      - name: Record published build artifact
        if: steps.artifact.outputs.available == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPEN_SYSTEM_GIT_SHA: ${{ steps.artifact.outputs.git_sha }}
          OPEN_SYSTEM_IMAGE_REF: ${{ steps.artifact.outputs.image_ref }}
          OPEN_SYSTEM_IMAGE_DIGEST: ${{ steps.artifact.outputs.image_digest }}
          OPEN_SYSTEM_ENV: build-artifact
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "Supabase secrets not set; skip."
            exit 0
          fi
          chmod +x scripts/supabase/record-deployment.sh
          GIT_SHA="$OPEN_SYSTEM_GIT_SHA" IMAGE_REF="$OPEN_SYSTEM_IMAGE_REF" \
            ENV_NAME="$OPEN_SYSTEM_ENV" ./scripts/supabase/record-deployment.sh

      - name: State verification boundary
        run: |
          {
            echo "### Open-System artifact synchronization"
            echo
            echo "- Docker publish metadata is recorded as build-artifact, not production."
            echo "- Production requires staging smoke, live health and critical-path evidence, rollback reference, and written approval."
          } >> "$GITHUB_STEP_SUMMARY"
