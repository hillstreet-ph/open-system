# Production Hermes admin tasks against the dashboard API (deploy/hermes-admin.py).
# The dashboard login is read from Railway with RAILWAY_TOKEN inside the job; nothing secret
# is printed. Manual dispatch, plus a scheduled `guard` that corrects drifted default model routing
# (auto-rotation re-enabled, provider moved off open-connect) and restarts the gateway only then.
name: Open-System admin

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [diagnose, inventory, fix, guard, optimize, procs, cron, skills-sync, config-lines, config-repair]
        default: diagnose

permissions:
  contents: read

concurrency:
  group: open-system-admin
  cancel-in-progress: false

jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_VOLUME_INSTANCE_ID: ${{ vars.RAILWAY_VOLUME_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: deploy
      - name: Volume snapshot before changes
        if: inputs.action == 'fix'
        # Config-only change; off-site backups run continuously. A full Railway backup quota must not block repairs.
        continue-on-error: true
        run: bash deploy/railway.sh backup "pre-admin-${{ inputs.action }}-$(date -u +%Y%m%dT%H%M)"
      - name: Run ${{ inputs.action || 'guard' }}
        shell: bash
        env:
          ACTION: ${{ inputs.action || 'guard' }}
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet --user --break-system-packages pyyaml
          python3 deploy/hermes-admin.py "$ACTION"
