name: Upstream Sync (Hermes)

# Detects new commits/tags on NousResearch/hermes-agent and opens a PR.
# NEVER merges automatically into main. Human review required.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream branch to sync (default main)"
        required: false
        default: "main"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'hillstreet-ph/open-system'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout open-system
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "open-system-upstream-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git || true
          git fetch upstream --tags --prune

      - name: Resolve upstream ref
        id: ref
        env:
          REQUESTED_REF: ${{ github.event.inputs.ref || 'main' }}
        run: |
          REF="$REQUESTED_REF"
          git check-ref-format "refs/heads/$REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          UPSTREAM_SHA=$(git rev-parse "upstream/$REF")
          echo "sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "short=$(echo $UPSTREAM_SHA | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Check if already up to date
        id: status
        env:
          UPSTREAM_SHA: ${{ steps.ref.outputs.sha }}
          UPSTREAM_REF: ${{ steps.ref.outputs.ref }}
        run: |
          UPSTREAM="$UPSTREAM_SHA"
          if git merge-base --is-ancestor "$UPSTREAM" HEAD; then
            echo "behind=false" >> "$GITHUB_OUTPUT"
            echo "Open-System already contains upstream $UPSTREAM_REF@$UPSTREAM"
          else
            echo "behind=true" >> "$GITHUB_OUTPUT"
            AHEAD=$(git rev-list --count HEAD.."$UPSTREAM" || echo "?")
            echo "commits_behind=$AHEAD" >> "$GITHUB_OUTPUT"
            echo "Open-System is $AHEAD commit(s) behind upstream"
          fi

      - name: Create sync branch and merge
        if: steps.status.outputs.behind == 'true'
        id: branch
        env:
          SYNC_BRANCH: upstream-sync/${{ steps.ref.outputs.ref }}-${{ steps.ref.outputs.short }}
          UPSTREAM_SHA: ${{ steps.ref.outputs.sha }}
        run: |
          git check-ref-format "refs/heads/$SYNC_BRANCH"
          echo "name=$SYNC_BRANCH" >> "$GITHUB_OUTPUT"
          git checkout -b "$SYNC_BRANCH"
          if git merge --no-ff "$UPSTREAM_SHA" -m "chore(upstream): sync hermes-agent @$UPSTREAM_SHA"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U
            git merge --abort || true
            echo "::error::Upstream merge failed; fork history preserved and no branch pushed. Reconcile conflicts on a reviewed branch."
            exit 1
          fi
          # A stale existing branch must be reconciled, never overwritten.
          git push -u origin "$SYNC_BRANCH"

      - name: Open pull request
        if: steps.status.outputs.behind == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_BRANCH: ${{ steps.branch.outputs.name }}
          MERGE_CONFLICT: ${{ steps.branch.outputs.conflict }}
          UPSTREAM_REF: ${{ steps.ref.outputs.ref }}
          UPSTREAM_SHA: ${{ steps.ref.outputs.sha }}
          UPSTREAM_SHORT: ${{ steps.ref.outputs.short }}
          COMMITS_BEHIND: ${{ steps.status.outputs.commits_behind }}
        run: |
          BRANCH="$SYNC_BRANCH"
          CONFLICT="$MERGE_CONFLICT"
          BODY=$(cat <<EOF
          ## Upstream sync from NousResearch/hermes-agent

          | Field | Value |
          |-------|-------|
          | Upstream ref | \`${UPSTREAM_REF}\` |
          | Upstream SHA | \`${UPSTREAM_SHA}\` |
          | Commits behind | ${COMMITS_BEHIND} |
          | Auto-merge conflict | **${CONFLICT}** |

          ### Review checklist
          - [ ] CI green on this branch
          - [ ] No secret leakage in diff
          - [ ] Dockerfile ENTRYPOINT/CMD unchanged unless intentional
          - [ ] /opt/data volume contract preserved
          - [ ] Open-System deploy/scripts still valid
          - [ ] Prefer stable release tags over bleeding-edge main when promoting to production

          **This workflow never merges to main.** Approve and merge only after review.

          Upstream: https://github.com/NousResearch/hermes-agent/commits/${UPSTREAM_REF}
          EOF
          )
          EXISTING=$(gh pr list --head "$BRANCH" --json number --jq 'length')
          if [ "$EXISTING" != "0" ]; then
            echo "PR already exists for $BRANCH"
          else
            gh pr create \
              --title "chore(upstream): sync hermes-agent ${UPSTREAM_REF}@${UPSTREAM_SHORT}" \
              --body "$BODY" \
              --base main \
              --head "$BRANCH"
          fi

      - name: Summary
        if: always()
        env:
          BEHIND: ${{ steps.status.outputs.behind }}
          UPSTREAM_REF: ${{ steps.ref.outputs.ref }}
          UPSTREAM_SHA: ${{ steps.ref.outputs.sha }}
        run: |
          echo "### Upstream sync" >> "$GITHUB_STEP_SUMMARY"
          echo "- Behind: $BEHIND" >> "$GITHUB_STEP_SUMMARY"
          echo "- Upstream: $UPSTREAM_REF@$UPSTREAM_SHA" >> "$GITHUB_STEP_SUMMARY"
