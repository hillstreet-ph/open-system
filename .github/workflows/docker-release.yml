name: Open-System Docker Release

# Publishes immutable images for hillstreet-ph/open-system to Docker Hub.
# Upstream docker.yml is gated to NousResearch/hermes-agent only.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME
#   DOCKERHUB_TOKEN
# Canonical publish destination: hillstreet/open-system
# The login identity may be a scoped service account with organization push access.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      promote_stable:
        description: "Also tag this build as :stable"
        required: false
        default: "false"
        type: boolean
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: open-system-docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.repository == 'hillstreet-ph/open-system'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve canonical image name
        id: image
        run: echo "name=hillstreet/open-system" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=raw,value=stable,enable=${{ github.event_name == 'workflow_dispatch' && inputs.promote_stable == true }}
            type=raw,value=hermes-main,enable={{is_default_branch}}

      - name: Build and push multi-arch
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=open-system
            org.opencontainers.image.description=Open-System / Hermes Agent production image
            org.opencontainers.image.source=https://github.com/hillstreet-ph/open-system
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor=hillstreet-ph
          build-args: |
            HERMES_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=open-system-docker
          cache-to: type=gha,mode=max,scope=open-system-docker
          provenance: false

      - name: Output digests
        run: |
          echo "### Open-System image published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image:** \`${{ steps.image.outputs.name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Digest:** \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tags:**" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Prefer digest for production cutover:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
