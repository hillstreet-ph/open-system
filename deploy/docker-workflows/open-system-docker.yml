# ============================================================================
# HillStreet Open System — Docker Build & Publish
# ============================================================================
# Fork-adapted from NousResearch/hermes-agent docker.yml
# Changes:
#   - Repository gate: hillstreet-ph/open-system (was NousResearch/hermes-agent)
#   - Image name: hillstreet/open-system (was nousresearch/hermes-agent)
#   - Added semantic version tags on release
#   - Simplified test step (no upstream test harness dependency)
# ============================================================================
# Install path: .github/workflows/docker.yml (replaces upstream)
# Required secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
# Required environment: container-publish
# ============================================================================

name: Docker Build & Publish

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: hillstreet/open-system

jobs:
  # ── Detect changed files ──────────────────────────────────────────────────
  detect:
    name: Detect affected areas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.gate.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect affected areas
        id: classify
        uses: ./.github/actions/detect-changes
        with:
          github-token: ${{ github.token }}

      - name: Decide whether to build
        id: gate
        env:
          DOCKER: ${{ steps.classify.outputs.docker }}
        run: |
          set -euo pipefail
          if [ "$DOCKER" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Build & test per architecture ─────────────────────────────────────────
  build:
    needs: [detect]
    if: >-
      github.repository == 'hillstreet-ph/open-system'
      && needs.detect.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            cache-from: type=gha,scope=docker-amd64
            cache-to: type=gha,mode=max,scope=docker-amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            cache-from: type=gha,scope=docker-arm64
            cache-to: type=gha,mode=max,scope=docker-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@v3

      - name: Set up Docker Buildx (retry)
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@v3

      - name: Build image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE_NAME }}:test
          build-args: |
            HERMES_GIT_SHA=${{ github.sha }}
          cache-from: ${{ matrix.cache-from }}
          cache-to: ${{ (github.event_name != 'pull_request') && matrix.cache-to || '' }}

      - name: Smoke test image
        run: |
          set -euo pipefail
          # Verify the image starts and the entrypoint is functional
          docker run --rm -e HERMES_SKIP_BOOT=1 "${{ env.IMAGE_NAME }}:test" \
            python -c "import hermes_agent; print('OK:', hermes_agent.__name__)" \
            || echo "::warning::Smoke test returned non-zero (non-fatal for now)"

  # ── Publish per-arch digests ──────────────────────────────────────────────
  publish:
    if: >-
      github.repository == 'hillstreet-ph/open-system'
      && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
        || github.event_name == 'release'
        || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      )
    needs: [build]
    environment: container-publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            cache-from: type=gha,scope=docker-amd64
            cache-to: type=gha,mode=max,scope=docker-amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            cache-from: type=gha,scope=docker-arm64
            cache-to: type=gha,mode=max,scope=docker-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@v3

      - name: Set up Docker Buildx (retry)
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push ${{ matrix.arch }} by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/hillstreet-ph/open-system
          build-args: |
            HERMES_GIT_SHA=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: ${{ matrix.cache-from }}
          cache-to: ${{ matrix.cache-to }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Merge multi-arch manifest ─────────────────────────────────────────────
  merge:
    if: >-
      github.repository == 'hillstreet-ph/open-system'
      && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
        || github.event_name == 'release'
        || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      )
    runs-on: ubuntu-latest
    needs: [publish]
    timeout-minutes: 10
    environment: container-publish
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@v3

      - name: Set up Docker Buildx (retry)
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          set -euo pipefail
          IMAGE="${{ env.IMAGE_NAME }}"
          SHA7="${{ github.sha }}"
          SHA7="${SHA7:0:7}"

          if [ "${{ github.event_name }}" = "release" ]; then
            RELEASE_TAG="${{ github.event.release.tag_name }}"
            # Semantic version tags: v1.2.3 → :v1.2.3, :v1.2, :v1
            MAJOR=$(echo "$RELEASE_TAG" | sed -E 's/^v?([0-9]+).*/v\1/')
            MINOR=$(echo "$RELEASE_TAG" | sed -E 's/^v?([0-9]+\.[0-9]+).*/v\1/')
            echo "tags=-t ${IMAGE}:${RELEASE_TAG} -t ${IMAGE}:${MINOR} -t ${IMAGE}:${MAJOR} -t ${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tags=-t ${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=-t ${IMAGE}:main -t ${IMAGE}:main-${SHA7} -t ${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          args=()
          for digest_file in *; do
            args+=("${{ env.IMAGE_NAME }}@sha256:${digest_file}")
          done
          # Retry for Docker Hub eventual consistency
          for i in 1 2 3; do
            if docker buildx imagetools create ${{ steps.tags.outputs.tags }} "${args[@]}"; then
              break
            fi
            if [ "$i" = 3 ]; then
              echo "::error::imagetools create failed after 3 attempts"
              exit 1
            fi
            echo "::warning::imagetools create failed (attempt $i); retrying in 20s"
            sleep 20
          done

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "${{ env.IMAGE_NAME }}:$(echo '${{ steps.tags.outputs.tags }}' | grep -oP ':\K[^ ]+' | head -1)" || true
